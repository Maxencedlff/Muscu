# Projet Supabase de l'app (mdlf-training). Seul réglage versionné : les fonctions.
project_id = "yopptmdjtnezmccdvaxf"

[functions.delete-account]
# Jeton vérifié dans le code (auth.getUser), compatible avec les clés de signature asymétriques ;
# la passerelle ne le revérifie pas (recommandation Supabase pour les nouvelles clés)
verify_jwt = false

[functions.revoke-apple]
# Même choix que delete-account : jeton vérifié dans le code (auth.getUser)
verify_jwt = false

[functions.verify-purchase]
# Même choix que delete-account : jeton vérifié dans le code (caller, _shared/auth-guard.js), 401 sinon
verify_jwt = false

[functions.report]
# Même choix que delete-account : jeton vérifié dans le code (auth.getUser)
verify_jwt = false

[functions.coach-request-alert]
# Même choix que delete-account : jeton vérifié dans le code (caller, _shared/auth-guard.js), 401 sinon
verify_jwt = false

[functions.strava-connect]
# POST : jeton vérifié dans le code (auth.getUser). GET : retour de Strava dans Safari, sans jeton de
# session (c'est l'état OAuth à usage unique qui désigne le compte) : la passerelle ne doit rien exiger
verify_jwt = false

[functions.strava-export]
# Même choix que delete-account : jeton vérifié dans le code (auth.getUser)
verify_jwt = false

[functions.strava-disconnect]
# Même choix que delete-account : jeton vérifié dans le code (auth.getUser)
verify_jwt = false

[functions.push-send]
# Appelée par la planification (pg_cron + pg_net, docs/BUILD.md), jamais par l'app : pas de jeton de
# session, un secret partagé PUSH_CRON_SECRET vérifié dans le code (en-tête x-push-secret)
verify_jwt = false

[functions.coach-photos-purge]
# Appelée par la planification (pg_cron + pg_net, docs/PHOTOS_BILAN.md), jamais par l'app : pas de jeton de
# session, un secret partagé PHOTOS_PURGE_SECRET vérifié dans le code (en-tête x-purge-secret)
verify_jwt = false
