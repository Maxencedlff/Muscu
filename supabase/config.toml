# Projet Supabase de l'app (mdlf-training). Seul réglage versionné : les fonctions.
project_id = "yopptmdjtnezmccdvaxf"

[functions.delete-account]
# Jeton vérifié dans le code (auth.getUser), compatible avec les clés de signature asymétriques ;
# la passerelle ne le revérifie pas (recommandation Supabase pour les nouvelles clés)
verify_jwt = false

[functions.revoke-apple]
# Même choix que delete-account : jeton vérifié dans le code (auth.getUser)
verify_jwt = false

[functions.report]
# Même choix que delete-account : jeton vérifié dans le code (auth.getUser)
verify_jwt = false

[functions.push-send]
# Appelée par la planification (pg_cron + pg_net, docs/BUILD.md), jamais par l'app : pas de jeton de
# session, un secret partagé PUSH_CRON_SECRET vérifié dans le code (en-tête x-push-secret)
verify_jwt = false
