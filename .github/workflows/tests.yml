name: Tests

# À chaque envoi :
#  1. unit : syntaxe de tous les scripts, tests unitaires (dont le pont natif), contenu de l'app iOS, lint, architecture ;
#  2. e2e : l'app tourne pour de vrai dans WebKit (iPhone 13) et Chromium (Pixel 7), toute la suite
#     Playwright en thème sombre, répartie sur 4 machines (e2e 1/4 à 4/4) ;
#  2 bis. coach-web : l'appli web du coach (coach-web/, docs/COACH_WEB.md) dans Chromium, Firefox et WebKit, à 1440,
#     1180 et 820 px, sombre et clair, plus sa version construite (dist-coach/) avec le vrai supabase-js, et le mode coach
#     grand écran de l'app sur iPad (Chromium et WebKit, docs/COACH_IPAD.md) ;
#  3. edge : les 12 fonctions Edge (supabase/functions) compilées par Deno (deno check, dépendances figées
#     par supabase/functions/deno.lock) et appelées pour de vrai par tests/deno (refus d'entrée, sans réseau) ;
#  4. deploy : sur main seulement, et seulement si 1, 2 et 3 sont verts, publication de web-public/ sur
#     https://mdlf.app (Cloudflare Pages, projet mdlf-web), puis copie de secours sur le projet Vercel « muscu »
#     (muscu-eta.vercel.app), gardé tant que docs/HEBERGEMENT.md le dit. Vercel ne publie plus seul (vercel.json : git.deploymentEnabled) ;
#  5. coach-web-deploy : mêmes conditions, publication de dist-coach/ sur https://coach.mdlf.app (Pages, projet mdlf-coach),
#     avec le commit publié dans le résumé du job (avant le 25/11/2026, publication à la main sans trace).
# Tout tourne sur Linux : aucun quota macOS.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Sur main, jamais interrompus et un seul groupe : la garde de l'OTA (ota.yml) et de TestFlight (ios.yml)
  # attend les tests de SON commit, et les publications du site passent l'une après l'autre, dans l'ordre.
  # Sur une autre branche, un nouvel envoi annule les tests en cours de la même branche (les 20 machines
  # du compte sont partagées, 18/11). Conséquence : une build TestFlight lancée depuis une branche doit
  # l'être après le dernier envoi de cette branche (annulés, ses tests font échouer la garde, build 41 du 03/11).
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0 # rollback_check.sh relit un ancien social_test.sql (git show)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Syntaxe des scripts
        run: for f in $(find js coach-web/js coach-embed -name '*.js') sw.js; do node --check "$f"; done
      - name: Tests unitaires
        run: node tests/unit/run.mjs
      # Postgres local jetable (préinstallé sur ubuntu-latest) : RLS, GRANT et déclencheurs des migrations
      - name: Migrations Supabase (Postgres local, rien d'envoyé au projet)
        run: bash tests/sql/run.sh
      - name: Retours arrière des migrations (Postgres local)
        run: bash tests/sql/rollback_lot3_check.sh && bash tests/sql/rollback_check.sh && bash tests/sql/rollback_social_check.sh && bash tests/sql/rollback_push_check.sh && bash tests/sql/rollback_push_messages_check.sh && bash tests/sql/rollback_push_seances_check.sh && bash tests/sql/rollback_reaction_jaime_check.sh && bash tests/sql/rollback_messages_coach_check.sh
      # Montée de version de production : migrations jusqu'à 20261028, données réalistes, puis la suite
      - name: Montée de version des migrations (données de production simulées)
        run: bash tests/sql/upgrade_test.sh
      # Grâce de fin de séance sous concurrence (6 envois simultanés, 2 acceptés)
      - name: Grâce de fin de séance en parallèle
        run: bash tests/sql/grace_race_test.sh
      # Retour arrière du payant plus (accès à vie offerts révocables), puis les tests des tarifs
      - name: Retour arrière du payant plus
        run: bash tests/sql/rollback_payant_plus.sh
      # Tous les retours arrière depuis le 29/10 : seuls, puis démontage complet, état identique (pg_dump)
      - name: Retours arrière (démontage complet, état identique)
        run: bash tests/sql/rollback_nuit_check.sh
      # Mise en production dans l'ordre réel (migrations du payant après le lot 3), puis retours arrière
      - name: Mise en production dans l'ordre réel
        run: bash tests/sql/prod_order_test.sh
      - name: Retour arrière de la photo de profil (refusé avec un fichier, puis complet)
        run: bash tests/sql/photo_profil_rollback_test.sh
      - name: Retour arrière de la fiche Semaines du coach
        run: bash tests/sql/semaines_coach_rollback_test.sh
      - name: Retour arrière des bilans configurables
        run: bash tests/sql/bilans_coach_rollback_test.sh
      - name: Retour arrière des programmes envoyés (appli web du coach, vague 4)
        run: bash tests/sql/programmes_envoyes_coach_rollback_test.sh
      - name: Retour arrière du blocage qui coupe le lien coach
        run: bash tests/sql/blocage_coupe_coach_rollback_test.sh
      - name: Retour arrière de l'accord daté des bilans et des questions réservées aux 18 ans
        run: bash tests/sql/bilans_accord_majeur_rollback_test.sh
      - name: Contenu web de l'app iOS
        run: npm ci && npm run web:build
      - name: Lint (ESLint, erreurs réelles)
        run: npm run lint
      # Règles d'ARCHITECTURE.md vérifiées sur le code (tools/archi/check.mjs, exceptions datées dans exceptions.mjs),
      # puis les tests de l'outil ; après npm ci : acorn et eslint-scope viennent d'ESLint
      - name: Architecture (couches, taille, ordre de chargement, doublons app / site, docs)
        run: node tools/archi/check.mjs && node --test tools/archi/check.test.mjs

  e2e:
    # Conteneur officiel de Playwright (navigateurs et dépendances système déjà dedans) : plus d'installation
    # apt à chaque job, qui prenait jusqu'à 20 min chez GitHub (18/11). Image figée par empreinte, à la
    # version EXACTE de PLAYWRIGHT_VERSION (les navigateurs de l'image ne servent qu'à ce paquet-là).
    # La suite est répartie en 4 parts parallèles (run_all.py, PPL_SHARD) d'après les durées mesurées sur
    # la CI (tests/ci_durees.json) : ~8 min chacune au lieu de 25 à 47 min en série. Le workflow n'est vert
    # que si les 4 parts le sont (c'est lui que lisent ota.yml, ios.yml et publier.sh, pas le nom du job).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --ipc=host   # mémoire partagée de l'hôte : /dev/shm de Docker (64 Mo) fait planter Chromium
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    name: e2e ${{ matrix.part }}/4
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: 1.62.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Playwright et polices
        run: bash tests/ci_conteneur.sh
      - name: Serveur local de l'app
        run: |
          python -m http.server 8731 > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 20); do python -c "import urllib.request as u; u.urlopen('http://localhost:8731/')" 2>/dev/null && break; sleep 0.5; done
      - name: Suite Playwright (iPhone 13 et Pixel 7, sombre), part ${{ matrix.part }}/4
        env:
          PPL_URL: http://localhost:8731/
          PPL_DEVICES: iPhone 13,Pixel 7
          PPL_THEMES: dark
          PPL_JOBS: '3'
          PPL_SHARD: ${{ matrix.part }}/4
        # RUNNER_TEMP du conteneur (/__w/_temp) : ${{ runner.temp }} donnerait le chemin de l'hôte
        run: cd tests && PPL_SCRATCH="$RUNNER_TEMP/ppl-tests" python -u run_all.py
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: captures-playwright-${{ matrix.part }}
          path: ${{ runner.temp }}/ppl-tests/shots
          retention-days: 7

  coach-web:
    # Appli web du coach (docs/COACH_WEB.md) : trois moteurs, trois largeurs, deux thèmes, parcours au clavier, serveur
    # d'avant la migration 20261124010000 (repli), refus, déconnexion. Même conteneur officiel que e2e ; ~4 min.
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    name: coach-web ${{ matrix.engine }}
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: 1.62.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Playwright et polices
        run: bash tests/ci_conteneur.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # supabase-js (version figée du package-lock) pour la version construite
      - name: Dépendances
        run: npm ci --ignore-scripts
      # HOME=/root : Firefox refuse de tourner en root avec le HOME de pwuser (conteneur de Playwright sur GitHub)
      - name: Appli web du coach, ${{ matrix.engine }}
        env:
          PPL_ENGINES: ${{ matrix.engine }}
          HOME: /root
        run: PPL_SCRATCH="$RUNNER_TEMP/ppl-tests" python -u tests/test_coach_web.py
      - name: Bilans configurables (Mes bilans, onglet Bilans, Bilans reçus), ${{ matrix.engine }}
        env:
          PPL_ENGINES: ${{ matrix.engine }}
          HOME: /root
        run: PPL_SCRATCH="$RUNNER_TEMP/ppl-tests" python -u tests/test_coach_web_bilans.py
      - name: Messages, Programme, Nutrition (vague 4), ${{ matrix.engine }}
        env:
          PPL_ENGINES: ${{ matrix.engine }}
          HOME: /root
        run: PPL_SCRATCH="$RUNNER_TEMP/ppl-tests" python -u tests/test_coach_web_v4.py
      - name: Plans diète (éditeur, recherche Ciqual, envoi), ${{ matrix.engine }}
        env:
          PPL_ENGINES: ${{ matrix.engine }}
          HOME: /root
        run: PPL_SCRATCH="$RUNNER_TEMP/ppl-tests" python -u tests/test_coach_web_diete.py
      # Mode coach grand écran sur iPad (docs/COACH_IPAD.md) : l'app construite (dist/ avec dist/coach/), 1024 × 1366 et
      # 1366 × 1024, Chromium et WebKit (Firefox n'est pas un moteur d'iPad)
      - name: Mode coach grand écran sur iPad, ${{ matrix.engine }}
        if: matrix.engine != 'firefox'
        env:
          PPL_ENGINES: ${{ matrix.engine }}
          HOME: /root
        run: PPL_SCRATCH="$RUNNER_TEMP/ppl-tests" python -u tests/test_coach_ipad.py
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: captures-coach-web-${{ matrix.engine }}
          path: ${{ runner.temp }}/ppl-tests/shots
          retention-days: 7

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      # --frozen : une dépendance (même transitive) absente de deno.lock ou d'empreinte différente fait échouer
      - name: Types des fonctions Edge (deno check)
        run: deno check --config supabase/functions/deno.json --frozen supabase/functions/*/index.ts
      # Seule permission : les variables lues par les fonctions (liste de tests/deno/fake.ts, ENV_KEYS), que les
      # tests remplissent de fausses valeurs. Ni réseau ni fichiers : fetch est un faux serveur (fake.ts).
      - name: Tests de comportement des fonctions Edge (deno test)
        env:
          MDLF_EDGE_TESTS: '1'   # les index.ts importés ne lancent pas Deno.serve (aucun port ouvert)
          EDGE_ENV: MDLF_EDGE_TESTS,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_SECRET_KEYS,SUPABASE_PUBLISHABLE_KEYS,PUSH_CRON_SECRET,PHOTOS_PURGE_SECRET,APNS_KEY_P8,APNS_KEY_ID,APNS_TEAM_ID,APNS_TOPIC,RESEND_API_KEY,APPLE_PRIVATE_KEY,APPLE_KEY_ID,APPLE_TEAM_ID,APPLE_CLIENT_ID,APPLE_IAP_KEY_ID,APPLE_IAP_PRIVATE_KEY,APPLE_ISSUER_ID,STRAVA_CLIENT_ID,STRAVA_CLIENT_SECRET,STRAVA_TOKEN_KEY,STRAVA_RETURN_URL
        run: deno test --config supabase/functions/deno.json --frozen --allow-env="$EDGE_ENV" tests/deno

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, e2e, coach-web, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Version web arrêtée le 22/10/2026 : le site ne publie plus que web-public/ (page « l'app est
      # sur iPhone », politique de confidentialité, URL déclarée à l'App Store, et pages juridiques), voir web-public/README.md
      # Garde : aucune page juridique publiée avec un emplacement « À COMPLÉTER » une fois l'app sortie
      # (variable du dépôt MDLF_SORTIE=true). Avant, TestFlight seul et verrou éteint : signalé sans
      # bloquer, pour que le site et les pages restent à jour (décision du 03/11/2026, docs/JURIDIQUE.md)
      - name: Pages juridiques sans emplacement à compléter
        env:
          SORTIE: ${{ vars.MDLF_SORTIE }}
        run: |
          if node scripts/check-legal-pages.mjs privacy.html mentions-legales.html cgu.html cgv.html; then
            echo "Pages juridiques complètes."
          elif [ "$SORTIE" = "true" ]; then
            echo "App sortie (MDLF_SORTIE=true) : pages juridiques incomplètes, rien n'est publié."; exit 1
          else
            echo "::warning::Pages juridiques incomplètes : acceptable sur TestFlight, bloquant dès MDLF_SORTIE=true."
          fi
      # Wrangler (CLI de Cloudflare) demande Node 22 ou plus
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # dist-web/ : web-public/ sans README ni vercel.json, pages juridiques, _headers et _redirects traduits de
      # web-public/vercel.json (scripts/build-web-public.mjs, docs/HEBERGEMENT.md). Version de wrangler figée.
      - name: Publication sur mdlf.app (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          node scripts/build-web-public.mjs
          npx --yes wrangler@4.157.0 pages deploy dist-web --project-name mdlf-web --branch main \
            --commit-hash "$SHA" --commit-message "tests.yml $SHA" --commit-dirty=true
      - name: mdlf.app sert la version publiée
        run: |
          for i in $(seq 1 12); do
            curl -fsS -H 'Cache-Control: no-cache' https://mdlf.app/privacy.html | cmp -s - dist-web/privacy.html && { echo "mdlf.app à jour."; exit 0; }
            sleep 5
          done
          echo "mdlf.app ne sert pas dist-web/privacy.html après 60 s"; exit 1
      # Copie de secours (retour arrière par le DNS, docs/HEBERGEMENT.md) : son échec ne bloque pas le site principal
      - name: Copie de secours sur muscu-eta.vercel.app
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        # La CLI échoue (code non nul) si la publication échoue ; version figée (pas de @latest)
        run: |
          cp privacy.html mentions-legales.html cgu.html cgv.html legal.css web-public/
          npx --yes vercel@62.0.0 deploy web-public --prod --yes --token "$VERCEL_TOKEN"

  # Appli web du coach : publiée seulement si tous les tests du commit sont verts, avec le commit dans le résumé
  coach-web-deploy:
    name: Publication de coach.mdlf.app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, e2e, coach-web, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      # supabase-js (version figée du package-lock), servi par le site
      - name: Construction (dist-coach/, en-têtes traduits de coach-web/vercel.json)
        run: |
          npm ci --ignore-scripts
          npm run coach-web:build
      - name: Publication sur coach.mdlf.app (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.sha }}
        run: |
          npx --yes wrangler@4.157.0 pages deploy dist-coach --project-name mdlf-coach --branch main \
            --commit-hash "$SHA" --commit-message "tests.yml $SHA" --commit-dirty=true
      - name: coach.mdlf.app sert la version publiée
        env:
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -H 'Cache-Control: no-cache' https://coach.mdlf.app/ | cmp -s - dist-coach/index.html; then
              echo "coach.mdlf.app à jour."
              echo "### coach.mdlf.app publié depuis $SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "coach.mdlf.app ne sert pas dist-coach/index.html après 60 s"; exit 1
