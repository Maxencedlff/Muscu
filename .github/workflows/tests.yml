name: Tests

# À chaque envoi :
#  1. unit : syntaxe de tous les scripts, tests unitaires (dont le pont natif), contenu de l'app iOS ;
#  2. e2e : l'app tourne pour de vrai dans WebKit (iPhone 13) et Chromium (Pixel 7), toute la suite
#     Playwright en thème sombre ;
#  3. edge : les 11 fonctions Edge (supabase/functions) compilées par Deno (deno check, dépendances figées
#     par supabase/functions/deno.lock) et appelées pour de vrai par tests/deno (refus d'entrée, sans réseau) ;
#  4. deploy : sur main seulement, et seulement si 1, 2 et 3 sont verts, publication de web-public/ sur
#     https://muscu-eta.vercel.app (la version web est arrêtée : seule l'app iOS reste). Vercel ne publie plus seul (vercel.json : git.deploymentEnabled).
# Tout tourne sur Linux : aucun quota macOS.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # Jamais interrompus : la build TestFlight (ios.yml, job gate) attend les tests de SON commit, et
  # un envoi plus récent qui les annulait faisait échouer la build (03/11/2026, build 41). Sur main,
  # un seul groupe : les publications du site passent l'une après l'autre, dans l'ordre.
  group: ${{ github.ref == 'refs/heads/main' && format('tests-{0}', github.ref) || format('tests-{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0 # rollback_check.sh relit un ancien social_test.sql (git show)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Syntaxe des scripts
        run: for f in $(find js -name '*.js') sw.js; do node --check "$f"; done
      - name: Tests unitaires
        run: node tests/unit/run.mjs
      # Postgres local jetable (préinstallé sur ubuntu-latest) : RLS, GRANT et déclencheurs des migrations
      - name: Migrations Supabase (Postgres local, rien d'envoyé au projet)
        run: bash tests/sql/run.sh
      - name: Retours arrière des migrations (Postgres local)
        run: bash tests/sql/rollback_lot3_check.sh && bash tests/sql/rollback_check.sh && bash tests/sql/rollback_social_check.sh && bash tests/sql/rollback_push_check.sh && bash tests/sql/rollback_push_messages_check.sh
      # Montée de version de production : migrations jusqu'à 20261028, données réalistes, puis la suite
      - name: Montée de version des migrations (données de production simulées)
        run: bash tests/sql/upgrade_test.sh
      # Grâce de fin de séance sous concurrence (6 envois simultanés, 2 acceptés)
      - name: Grâce de fin de séance en parallèle
        run: bash tests/sql/grace_race_test.sh
      # Retour arrière du payant plus (accès à vie offerts révocables), puis les tests des tarifs
      - name: Retour arrière du payant plus
        run: bash tests/sql/rollback_payant_plus.sh
      # Tous les retours arrière depuis le 29/10 : seuls, puis démontage complet, état identique (pg_dump)
      - name: Retours arrière (démontage complet, état identique)
        run: bash tests/sql/rollback_nuit_check.sh
      # Mise en production dans l'ordre réel (migrations du payant après le lot 3), puis retours arrière
      - name: Mise en production dans l'ordre réel
        run: bash tests/sql/prod_order_test.sh
      - name: Contenu web de l'app iOS
        run: npm ci && npm run web:build
      - name: Lint (ESLint, erreurs réelles)
        run: npm run lint

  e2e:
    # ubuntu-24.04 fixé : sur ubuntu-26.04 (ubuntu-latest depuis le 01/11/2026), les navigateurs de Playwright 1.62 ne démarrent pas
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # 153 processus en ~25 min au 06/11 : marge pour la suite qui grandit
    env:
      PLAYWRIGHT_VERSION: 1.62.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Navigateurs en cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Playwright, WebKit et Chromium
        run: |
          pip install "playwright==$PLAYWRIGHT_VERSION" "pillow==12.1.1"   # pillow : JPEG avec EXIF et GPS du test des photos de bilan
          python -m playwright install --with-deps chromium webkit
      - name: Serveur local de l'app
        run: |
          python -m http.server 8731 > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8731/ && break; sleep 0.5; done
      - name: Suite Playwright (iPhone 13 et Pixel 7, sombre)
        env:
          PPL_URL: http://localhost:8731/
          PPL_DEVICES: iPhone 13,Pixel 7
          PPL_THEMES: dark
          PPL_JOBS: '3'
          PPL_SCRATCH: ${{ runner.temp }}/ppl-tests
        run: cd tests && python -u run_all.py
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: captures-playwright
          path: ${{ runner.temp }}/ppl-tests/shots
          retention-days: 7

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      # --frozen : une dépendance (même transitive) absente de deno.lock ou d'empreinte différente fait échouer
      - name: Types des fonctions Edge (deno check)
        run: deno check --config supabase/functions/deno.json --frozen supabase/functions/*/index.ts
      # Seule permission : les variables lues par les fonctions (liste de tests/deno/fake.ts, ENV_KEYS), que les
      # tests remplissent de fausses valeurs. Ni réseau ni fichiers : fetch est un faux serveur (fake.ts).
      - name: Tests de comportement des fonctions Edge (deno test)
        env:
          MDLF_EDGE_TESTS: '1'   # les index.ts importés ne lancent pas Deno.serve (aucun port ouvert)
          EDGE_ENV: MDLF_EDGE_TESTS,SUPABASE_URL,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_SECRET_KEYS,SUPABASE_PUBLISHABLE_KEYS,PUSH_CRON_SECRET,PHOTOS_PURGE_SECRET,APNS_KEY_P8,APNS_KEY_ID,APNS_TEAM_ID,APNS_TOPIC,RESEND_API_KEY,APPLE_PRIVATE_KEY,APPLE_KEY_ID,APPLE_TEAM_ID,APPLE_CLIENT_ID,APPLE_IAP_KEY_ID,APPLE_IAP_PRIVATE_KEY,APPLE_ISSUER_ID,STRAVA_CLIENT_ID,STRAVA_CLIENT_SECRET,STRAVA_TOKEN_KEY,STRAVA_RETURN_URL
        run: deno test --config supabase/functions/deno.json --frozen --allow-env="$EDGE_ENV" tests/deno

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, e2e, edge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Version web arrêtée le 22/10/2026 : le site ne publie plus que web-public/ (page « l'app est
      # sur iPhone », politique de confidentialité, URL déclarée à l'App Store, et pages juridiques), voir web-public/README.md
      # Garde : aucune page juridique publiée avec un emplacement « À COMPLÉTER » une fois l'app sortie
      # (variable du dépôt MDLF_SORTIE=true). Avant, TestFlight seul et verrou éteint : signalé sans
      # bloquer, pour que le site et les pages restent à jour (décision du 03/11/2026, docs/JURIDIQUE.md)
      - name: Pages juridiques sans emplacement à compléter
        env:
          SORTIE: ${{ vars.MDLF_SORTIE }}
        run: |
          if node scripts/check-legal-pages.mjs privacy.html mentions-legales.html cgu.html cgv.html; then
            echo "Pages juridiques complètes."
          elif [ "$SORTIE" = "true" ]; then
            echo "App sortie (MDLF_SORTIE=true) : pages juridiques incomplètes, rien n'est publié."; exit 1
          else
            echo "::warning::Pages juridiques incomplètes : acceptable sur TestFlight, bloquant dès MDLF_SORTIE=true."
          fi
      - name: Publication sur muscu-eta.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        # La CLI échoue (code non nul) si la publication échoue ; version figée (pas de @latest)
        run: |
          cp privacy.html mentions-legales.html cgu.html cgv.html legal.css web-public/
          npx --yes vercel@62.0.0 deploy web-public --prod --yes --token "$VERCEL_TOKEN"
