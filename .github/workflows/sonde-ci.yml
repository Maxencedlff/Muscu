name: Sonde CI (temporaire)

# Comparaison machine GitHub + install --with-deps (actuel) contre le conteneur officiel Playwright.
# À supprimer avant la fusion dans main.
on:
  push:
    branches: ['ci-rapide']

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [hote, conteneur]
    name: sonde · ${{ matrix.mode }}
    container: ${{ matrix.mode == 'conteneur' && fromJSON('{"image":"mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d","options":"--ipc=host"}') || null }}
    env:
      PLAYWRIGHT_VERSION: 1.62.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - if: matrix.mode == 'hote'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: matrix.mode == 'hote'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Installation (hote)
        if: matrix.mode == 'hote'
        run: |
          pip install "playwright==$PLAYWRIGHT_VERSION" "pillow==12.1.1"
          time python -m playwright install --with-deps chromium webkit
      - name: Installation (conteneur)
        if: matrix.mode == 'conteneur'
        run: |
          set -x
          command -v python python3 pip pip3 curl || true
          python3 -c "import importlib.metadata as m; print('playwright', m.version('playwright'))" || true
          python3 -m pip install --break-system-packages "playwright==$PLAYWRIGHT_VERSION" "pillow==12.1.1" || python3 -m pip install "playwright==$PLAYWRIGHT_VERSION" "pillow==12.1.1"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"; ls "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}"
          id; cat /etc/os-release | head -3
      - name: Environnement
        run: |
          PY=$(command -v python || command -v python3)
          echo "python: $PY $($PY --version)"; echo "TZ=$TZ LANG=$LANG LC_ALL=$LC_ALL"; date; cat /etc/timezone 2>/dev/null; ls -l /etc/localtime
          locale 2>/dev/null || true
          for f in sans-serif serif monospace system-ui -apple-system "SF Pro" emoji; do echo "fc-match $f: $(fc-match "$f")"; done
          fc-list : family | sort -u > /tmp/polices.txt; wc -l /tmp/polices.txt; cat /tmp/polices.txt
          free -m; nproc; df -h /dev/shm
          cat > /tmp/sonde.py <<'EOF'
          import json
          from playwright.sync_api import sync_playwright
          JS = """() => { const c = document.createElement('canvas').getContext('2d'); const out = {};
            for (const f of ['17px -apple-system, system-ui, sans-serif', '600 22px ui-rounded, -apple-system, system-ui, sans-serif', '15px sans-serif', '13px monospace']) {
              c.font = f; out[f] = ['Développé couché 4 × 8 à 82,5 kg', 'Mardi 25 novembre', '💪 Séance terminée'].map(s => Math.round(c.measureText(s).width * 100) / 100); }
            const o = Intl.DateTimeFormat().resolvedOptions();
            return { widths: out, tz: o.timeZone, locale: o.locale, lang: navigator.language, langs: navigator.languages,
                     date: new Date(Date.UTC(2026, 10, 25, 9)).toString(), num: (1234.5).toLocaleString() }; }"""
          with sync_playwright() as p:
              for eng, dev in (('webkit', 'iPhone 13'), ('chromium', 'Pixel 7')):
                  b = getattr(p, eng).launch(); ctx = b.new_context(**p.devices[dev]); pg = ctx.new_page()
                  pg.set_content('<p>x</p>'); print(eng, b.version, json.dumps(pg.evaluate(JS), ensure_ascii=False)); b.close()
          EOF
          $PY /tmp/sonde.py | tee /tmp/sonde.txt
      - name: Serveur local de l'app
        run: |
          PY=$(command -v python || command -v python3)
          $PY -m http.server 8731 > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 20); do $PY -c "import urllib.request; urllib.request.urlopen('http://localhost:8731/')" 2>/dev/null && break; sleep 0.5; done
      - name: Lots 1, 5 et nutrition (captures)
        env:
          PPL_URL: http://localhost:8731/
          PPL_DEVICES: iPhone 13,Pixel 7
          PPL_THEMES: dark
          PPL_JOBS: '3'
          PPL_RETRY: '0'
          PPL_SCRATCH: ${{ runner.temp }}/ppl-tests
        run: |
          PY=$(command -v python || command -v python3)
          cd tests && time $PY -u run_all.py 1 5 nutrition
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sonde-${{ matrix.mode }}
          path: ${{ runner.temp }}/ppl-tests/shots
          retention-days: 3
