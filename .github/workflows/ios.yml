name: iOS

# Deux modes, lancés à la main depuis l'onglet Actions (ou gh workflow run ios.yml) :
#  - contrôle (par défaut) : compile pour le simulateur, lance l'app sur un iPhone virtuel et
#    joint des captures d'écran. Ne demande aucun secret Apple.
#  - testflight : compile la version signée et l'envoie sur App Store Connect (TestFlight).
#    Demande les secrets ASC_KEY_ID, ASC_ISSUER_ID et ASC_KEY_P8 (clé d'API au rôle Admin).
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Envoyer une version signée sur TestFlight
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.testflight }}
  # Un contrôle peut être remplacé par un plus récent ; un envoi TestFlight ne s'annule jamais
  # (le 16/10, la build 13 a été coupée pendant son envoi à Apple)
  cancel-in-progress: ${{ !inputs.testflight }}

env:
  TEAM_ID: NMK739Z59B
  SCHEME: App
  PROJECT: ios/App/App.xcodeproj

defaults:
  run:
    shell: bash   # bash -eo pipefail : une erreur suivie de « | tail » fait bien échouer l'étape

jobs:
  # Rien ne part sur TestFlight (ni ne consomme le quota macOS) si les tests du même commit
  # ne sont pas verts : workflow Tests (unitaires et Playwright), terminé avec succès
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    steps:
      - name: Tests verts pour ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          C=$(gh api "repos/${{ github.repository }}/actions/workflows/tests.yml/runs?head_sha=${{ github.sha }}&status=completed&per_page=1" -q '.workflow_runs[0].conclusion')
          [ "$C" = success ] || { echo "Tests de ${{ github.sha }} : ${C:-pas encore terminés}. Relance quand ils sont verts."; exit 1; }

  build:
    needs: gate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Contenu web et synchronisation iOS
        run: npm run web:build && npx cap sync ios

      # Apple refuse les envois compilés avec un SDK antérieur à iOS 26 : Xcode 26 au minimum
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "Xcode 26 absent de l'image :"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version

      # ── Mode contrôle ─────────────────────────────────────────────
      - name: Compilation pour le simulateur
        if: ${{ !inputs.testflight }}
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 || {
              # En cas d'échec, les erreurs du compilateur (et non les 25 dernières lignes)
              grep -E -A4 'error:|BUILD FAILED' xcodebuild.log | head -120; exit 1; }
          grep -E 'warning: .*(RestActivity|LiveActivity|Shared/)' xcodebuild.log | sort -u | head -40 || true
          tail -5 xcodebuild.log

      - name: Lancement sur un iPhone virtuel et captures
        if: ${{ !inputs.testflight }}
        run: |
          set -e
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[6-9] Pro \(' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulateur : $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          # L'extension Live Activity doit être embarquée dans l'app
          test -d "$APP/PlugIns/RestActivity.appex" || { echo "Extension RestActivity absente de l'app"; exit 1; }
          # Compilée sans signature : le système du simulateur n'enregistre une extension que signée.
          # Signature ad hoc (« - ») d'une copie, de l'intérieur vers l'extérieur (frameworks,
          # extension, app) ; en cas d'échec, l'app non signée est installée comme avant.
          SIGNED="$RUNNER_TEMP/signed"; rm -rf "$SIGNED"; mkdir -p "$SIGNED"; cp -R "$APP" "$SIGNED/"
          SAPP="$SIGNED/$(basename "$APP")"
          adhoc() { codesign --force --sign - --timestamp=none "$1"; }
          sign_all() {
            if [ -d "$SAPP/Frameworks" ]; then
              for f in "$SAPP"/Frameworks/*.framework "$SAPP"/Frameworks/*.dylib; do
                [ -e "$f" ] && { adhoc "$f" || return 1; }
              done
            fi
            adhoc "$SAPP/PlugIns/RestActivity.appex" && adhoc "$SAPP"
          }
          if sign_all; then APP="$SAPP"; echo "App et extension signées (ad hoc)"
          else echo "Signature ad hoc impossible : app installée sans signature"; fi
          xcrun simctl install "$DEVICE" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p shots
          # Captures à heure fixe depuis le lancement (T0), notées dans le journal
          T0=$(date +%s)
          at() { local w=$(( T0 + $1 - $(date +%s) )); [ "$w" -gt 0 ] && sleep "$w"; return 0; }
          shot() { echo "T0+$(( $(date +%s) - T0 )) s : $1"; xcrun simctl io "$DEVICE" screenshot "shots/$1.png" > /dev/null 2>&1 || true; }
          # -MDLFDemoRestActivity (Debug seulement) : repos factice de 55 s ; alerte 22 s après le
          # début (présentation étendue de la Dynamic Island), « C'est reparti » une fois fini
          xcrun simctl launch "$DEVICE" "$BUNDLE" -MDLFDemoRestActivity
          at 12; shot 1-lancement
          xcrun simctl ui "$DEVICE" appearance light
          at 16; shot 2-theme-clair
          xcrun simctl launch "$DEVICE" com.apple.Preferences
          at 20; shot 3-dynamic-island
          at 25; shot 4-dynamic-island-etendue
          at 28; shot 5-dynamic-island-etendue
          xcrun simctl ui "$DEVICE" appearance dark
          at 32; shot 6-dynamic-island-sombre
          # Écran verrouillé : commande « Lock » de Simulator.app (⌘L)
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE" || true
          sleep 5
          osascript -e 'tell application "Simulator" to activate' \
            -e 'tell application "System Events" to keystroke "l" using command down' || true
          at 44; shot 7-ecran-verrouille-sombre
          xcrun simctl ui "$DEVICE" appearance light
          # Les commandes simctl prennent du retard (≈ 5 s) : marge après la fin du repos factice
          at 85; shot 8-ecran-verrouille-repos-fini
          # Extension enregistrée par le système, et journaux de son affichage
          xcrun simctl spawn "$DEVICE" pluginkit -m -A -v -p com.apple.widgetkit-extension > shots/pluginkit.txt 2>&1 || true
          grep -i restactivity shots/pluginkit.txt || echo "RestActivity absente de pluginkit"
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact \
            --predicate 'process == "RestActivity" OR process == "chronod" OR process == "pkd" OR eventMessage CONTAINS[c] "RestActivity"' \
            > shots/journal-extension.txt 2>&1 || true
          grep -iE 'RestActivity.*(error|fail|reject|invalid|crash)|(error|fail|reject|invalid).*RestActivity' shots/journal-extension.txt | head -20 || true
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 3
          # Journal de l'app (console JavaScript relayée par Capacitor en Debug) : erreurs au démarrage
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact \
            --predicate 'process == "App"' > shots/journal-app.txt 2>&1 || true
          grep -iE 'error|exception|⚡' shots/journal-app.txt > shots/erreurs.txt || true
          head -40 shots/erreurs.txt
          # L'app doit encore tourner (pas de plantage au démarrage). Liste écrite dans un fichier :
          # avec pipefail, « launchctl list | grep -q » échoue au hasard (SIGPIPE, code 141)
          xcrun simctl spawn "$DEVICE" launchctl list > shots/launchctl.txt
          grep -q "$BUNDLE" shots/launchctl.txt && echo "L'app tourne"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.testflight }}
        with:
          name: captures-simulateur
          path: shots/

      # ── Mode TestFlight ───────────────────────────────────────────
      # Signature manuelle : certificat Apple Distribution et profil App Store créés par l'API
      # (aucun appareil enregistré nécessaire), installés dans un trousseau temporaire.
      - name: Certificat et profil de distribution
        if: ${{ inputs.testflight }}
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          APPSTORE_PROFILE: ${{ secrets.APPSTORE_PROFILE }}
          APPSTORE_PROFILE_REST_ACTIVITY: ${{ secrets.APPSTORE_PROFILE_REST_ACTIVITY }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signature.keychain-db
          KC_PASS=$(openssl rand -base64 24)
          echo "$DIST_CERT_P12" | base64 --decode > $RUNNER_TEMP/dist.p12
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/dist.p12 -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          # Un profil par identifiant : l'app (com.mdlf.training) et son extension Live Activity
          # (com.mdlf.training.RestActivity). Un secret manquant arrête tout de suite l'envoi.
          PROFILES=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES"
          for name in APPSTORE_PROFILE APPSTORE_PROFILE_REST_ACTIVITY; do
            if [ -z "${!name}" ]; then echo "Secret $name absent"; exit 1; fi
          done
          echo "$APPSTORE_PROFILE" | base64 --decode > "$PROFILES/appstore.mobileprovision"
          echo "$APPSTORE_PROFILE_REST_ACTIVITY" | base64 --decode > "$PROFILES/appstore-rest-activity.mobileprovision"
          rm $RUNNER_TEMP/dist.p12

      - name: Clé d'API App Store Connect
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Archive signée
        if: ${{ inputs.testflight }}
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -40

      - name: Export et envoi sur App Store Connect
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath build/export \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40

      - name: Nettoyage du trousseau
        if: ${{ always() && inputs.testflight }}
        run: security delete-keychain $RUNNER_TEMP/signature.keychain-db || true
