name: Mise à jour à chaud

# Publie le contenu web de main comme mise à jour à chaud de l'app iOS (https://mdlf-ota.vercel.app).
# Lancement manuel uniquement :  gh workflow run ota.yml -R Maxencedlff/Muscu -f motif="…"
# Règle Apple 2.5.2 : à réserver aux corrections et petits ajustements ; une nouvelle fonctionnalité
# passe par une version TestFlight / App Store (ios.yml). Voir IOS.md.
on:
  workflow_dispatch:
    inputs:
      motif:
        description: Correction publiée (journal)
        required: true
        type: string

concurrency:
  group: ota
  cancel-in-progress: false

# Aucun droit par défaut : chaque job reçoit seulement ce dont il a besoin
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Rien n'est publié si le workflow Tests (unitaires, E2E Playwright, SQL, lint) n'est pas vert sur le
  # commit exact qui sera publié (audit du 12/11/2026, M6 ; même garde que le job gate d'ios.yml).
  # Lancé juste après un envoi sur main, il attend la fin des tests (jusqu'à 25 min) au lieu d'échouer.
  # Le SHA vérifié est transmis au job publish, qui construit depuis ce commit et pas depuis « main »
  # (qui a pu avancer entre-temps).
  gate:
    name: Tests verts sur le commit publié
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read   # lire l'état du workflow Tests sur ce commit
    outputs:
      sha: ${{ steps.tests.outputs.sha }}
    steps:
      - name: Tests verts pour ${{ github.sha }}
        id: tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "Mise à jour à chaud : seulement depuis main (lancé sur $REF)."; exit 1; }
          for i in $(seq 1 50); do
            R=$(gh api "repos/$REPO/actions/workflows/tests.yml/runs?head_sha=$SHA&per_page=1" -q '.workflow_runs[0] | "\(.status) \(.conclusion)"')
            case "$R" in
              "completed success") echo "Tests verts."; echo "sha=$SHA" >> "$GITHUB_OUTPUT"; exit 0 ;;
              completed*) echo "Tests de $SHA en échec ($R) : rien n'est publié."; exit 1 ;;
            esac
            echo "Tests ${R:-pas encore lancés}, nouvel essai dans 30 s"; sleep 30
          done
          echo "Tests toujours pas terminés après 25 min : rien n'est publié."; exit 1

  publish:
    name: Publication
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environnement GitHub « ota » : relecture obligatoire avant que les secrets de publication soient
    # remis au job (création par Maxence : docs/BUILD.md, « Environnement ota »)
    environment: ota
    permissions:
      contents: read   # extraire le commit testé
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      # Pas de cache npm : un cache empoisonné par un autre workflow ne doit jamais entrer dans un paquet
      # exécuté sur tous les iPhone
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Commit publié = commit testé
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "Commit extrait différent de $SHA"; exit 1; }
          echo "Publication de $SHA"

      - name: Tests (rien n'est publié s'ils échouent)
        run: |
          for f in $(find js -name '*.js') sw.js; do node --check "$f"; done
          node tests/unit/run.mjs

      # L'app ouvre les pages de LEGAL_URLS (écran d'abonnement : règle 3.1.2 d'Apple). Elles sont
      # publiées par le job deploy de tests.yml, pas ici (docs/JURIDIQUE.md). Bloquant dès que la
      # variable du dépôt MDLF_SORTIE vaut true (app sur l'App Store ou verrou allumé). Avant, l'app
      # n'est que sur TestFlight, verrou éteint : les emplacements restants sont signalés sans bloquer
      # (décision du 03/11/2026).
      - name: Pages juridiques complètes et en ligne
        env:
          SORTIE: ${{ vars.MDLF_SORTIE }}
        run: |
          if node scripts/check-legal-pages.mjs privacy.html mentions-legales.html cgu.html cgv.html \
             && node scripts/check-legal-online.mjs; then
            echo "Pages juridiques complètes et en ligne."
          elif [ "$SORTIE" = "true" ]; then
            echo "App sortie (MDLF_SORTIE=true) : pages juridiques incomplètes, rien n'est publié."; exit 1
          else
            echo "::warning::Pages juridiques incomplètes : acceptable sur TestFlight, bloquant dès MDLF_SORTIE=true."
          fi

      # Empreinte d'intégrité seulement, pas une signature : la signature Capgo s'active avec le secret
      # OTA_CAPGO_PRIVATE_KEY et la publicKey d'une nouvelle build (docs/BUILD.md). Tant que le secret
      # n'existe pas, la variable est vide et le paquet part comme avant.
      - name: Contenu web et empreinte SHA-256
        env:
          OTA_CAPGO_PRIVATE_KEY: ${{ secrets.OTA_CAPGO_PRIVATE_KEY }}
        run: |
          npm ci
          npm run web:build
          python3 scripts/ota-bundle.py

      - name: Publication sur mdlf-ota.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_OTA_PROJECT_ID }}
        run: |
          cd ota-site
          npx --yes vercel@62.0.0 deploy --prod --yes --token "$VERCEL_TOKEN" > ../deploy-url.txt
          cat ../deploy-url.txt

      - name: Vérification du manifeste en ligne
        env:
          # Texte libre saisi au lancement : passé par l'environnement, jamais injecté dans le script
          MOTIF: ${{ inputs.motif }}
        run: |
          # fileSha256 : SHA-256 du fichier servi (chiffré si le paquet est signé)
          EXPECTED=$(python3 -c "import json; print(json.load(open('ota-site/manifest.json'))['fileSha256'])")
          for i in 1 2 3 4 5 6; do
            ONLINE=$(curl -fsS https://mdlf-ota.vercel.app/manifest.json | python3 -c "import json,sys; print(json.load(sys.stdin)['fileSha256'])" || true)
            [ "$ONLINE" = "$EXPECTED" ] && break
            sleep 5
          done
          [ "$ONLINE" = "$EXPECTED" ] || { echo "Manifeste en ligne différent de celui publié"; exit 1; }
          URL=$(python3 -c "import json; print(json.load(open('ota-site/manifest.json'))['url'])")
          # Le manifeste peut être servi quelques secondes avant le paquet (constaté le 18/10) : on réessaie
          for i in 1 2 3 4 5 6; do curl -fsS "$URL" -o /tmp/b.zip && break; sleep 5; done
          echo "$EXPECTED  /tmp/b.zip" | sha256sum -c -
          {
            echo "### Mise à jour publiée"
            echo "- Motif : $MOTIF"
            echo "- Version : $(python3 -c "import json; print(json.load(open('ota-site/manifest.json'))['version'])")"
            echo "- Empreinte native : $(python3 -c "import json; print(json.load(open('ota-site/manifest.json'))['runtime'])")"
          } >> "$GITHUB_STEP_SUMMARY"
