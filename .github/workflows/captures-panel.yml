name: Captures du panel

# Captures commentées des parcours (tests/panel/capture_parcours.py) pour le panel d'ergonomie,
# réparties sur ~20 machines GitHub (~25 min au lieu de ~2 h 15 sur un seul PC). Une machine par
# mode (complet, recents, grand-texte) et par groupe de parcours ; la dernière tâche rassemble chaque
# mode dans un seul dossier (captures, index.md, resume.md, etapes.json) et le dépose en artefact.
# Lancement : gh workflow run captures-panel.yml --ref <branche> [-f parcours=accueil] ; récupération : gh run download <id>.
# Conteneur officiel de Playwright et tests/ci_conteneur.sh, comme tests.yml : pas d'installation apt par job.
# verif-ui (dépôt privé) n'est pas disponible ici : contrôles automatiques simples (controles.js).
on:
  workflow_dispatch:
    inputs:
      parcours:
        description: Un essai court sur ces parcours seulement (ex. « accueil »), mode complet, une machine ; vide = tout
        type: string
        default: ''
  push:
    branches: ['vague*-t*']

permissions:
  contents: read

concurrency:
  group: captures-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Matrice des machines : tests/panel/matrice.json (une machine par mode et groupe de parcours), ou une
  # seule machine en mode complet quand l'entrée « parcours » est donnée (essai court)
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: tests/panel/matrice.json
          sparse-checkout-cone-mode: false
      - id: m
        env:
          PARCOURS: ${{ inputs.parcours }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          p = os.environ.get('PARCOURS', '').strip()
          if p and not re.fullmatch(r'[a-z0-9-]+(,[a-z0-9-]+)*', p):
              raise SystemExit(f'parcours invalide : {p!r}')
          m = [{'mode': 'complet', 'opt': '', 'groupe': 'essai', 'parcours': p}] if p else json.load(open('tests/panel/matrice.json'))
          print('matrice=' + json.dumps(m))
          PY

  capture:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --ipc=host   # mémoire partagée de l'hôte : /dev/shm de Docker (64 Mo) fait planter Chromium
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrice) }}
    name: ${{ matrix.mode }} · ${{ matrix.groupe }}
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: 1.62.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Playwright et polices
        run: bash tests/ci_conteneur.sh
      - name: Serveur local de l'app
        run: |
          python -m http.server 8731 > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 20); do python -c "import urllib.request as u; u.urlopen('http://localhost:8731/')" 2>/dev/null && break; sleep 0.5; done
      - name: Captures
        env:
          PPL_URL: http://localhost:8731/
          MODE: ${{ matrix.mode }}
          OPT: ${{ matrix.opt }}
          GROUPE: ${{ matrix.groupe }}
          PARCOURS: ${{ matrix.parcours }}
        run: |
          # shellcheck disable=SC2086
          python -u tests/panel/capture_parcours.py "$RUNNER_TEMP/out/$MODE-$GROUPE" $OPT --parcours "$PARCOURS"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: part-${{ matrix.mode }}-${{ matrix.groupe }}
          path: ${{ runner.temp }}/out
          retention-days: 3

  rassembler:
    needs: capture
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Un dossier par mode
        run: |
          python3 - <<'PY'
          import json, os, re, shutil
          src, dst = 'parts', 'captures'
          for d in sorted(os.listdir(src)):
              mode = d.rsplit('-', 1)[0]
              out = os.path.join(dst, mode); os.makedirs(out, exist_ok=True)
              p = os.path.join(src, d)
              for f in os.listdir(p):
                  if f.endswith('.png'):
                      shutil.copy2(os.path.join(p, f), out)
              for f in ('index.md', 'resume.md'):
                  if os.path.exists(os.path.join(p, f)):
                      with open(os.path.join(out, f), 'a', encoding='utf-8') as o, open(os.path.join(p, f), encoding='utf-8') as i:
                          o.write(f'\n<!-- groupe {d} -->\n' + i.read())
              ej = os.path.join(p, 'etapes.json')
              if os.path.exists(ej):
                  tout = os.path.join(out, 'etapes.json')
                  prev = json.load(open(tout, encoding='utf-8')) if os.path.exists(tout) else []
                  json.dump(prev + json.load(open(ej, encoding='utf-8')), open(tout, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          for m in sorted(os.listdir(dst)):
              n = len([f for f in os.listdir(os.path.join(dst, m)) if f.endswith('.png')])
              e = json.load(open(os.path.join(dst, m, 'etapes.json'), encoding='utf-8'))
              ko = sum(1 for x in e if x.get('statut') == 'erreur'); ab = sum(1 for x in e if x.get('statut') == 'absent')
              print(f'{m} : {n} captures, {len(e)} étapes, {ab} absentes, {ko} en erreur')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: captures-panel
          path: captures
          retention-days: 7
