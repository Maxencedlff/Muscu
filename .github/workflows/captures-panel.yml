name: Captures du panel

# Captures commentées des parcours (tests/panel/capture_parcours.py) pour le panel d'ergonomie, sur
# plusieurs machines GitHub en parallèle au lieu du PC (un seul verrou de navigateurs pour tous les chantiers).
# Lancement : ~/.local/share/mdlf/outils/captures_gh.sh <branche> <parcours> <modes> <sortie> (lance, attend,
# télécharge et range), ou gh workflow run captures-panel.yml --ref <branche> -f parcours=accueil,programme
# -f modes=rapide,grand-texte -f jeton=<unique>. Parcours vide = tous (grand-texte : ses 12 parcours).
# Découpage (tests/panel/gh.py plan) : une machine par appareil du mode, parcours longs coupés en lots
# (~80 étapes, ~3 min), 20 machines au plus. La dernière tâche renumérote et rassemble chaque mode en un
# dossier au format du PC (PNG, index.md, resume.md, etapes.json) : artefact « captures-panel ».
# Conteneur officiel de Playwright et tests/ci_conteneur.sh, comme tests-complet.yml.
# verif-ui (dépôt privé) n'est pas disponible ici : contrôles automatiques simples (controles.js).
on:
  workflow_dispatch:
    inputs:
      parcours:
        description: Parcours séparés par des virgules (ex. « accueil,programme ») ; vide = tous
        type: string
        default: ''
      modes:
        description: Modes séparés par des virgules parmi rapide, grand-texte, complet, recents
        type: string
        default: rapide
      jeton:
        description: Identifiant libre repris dans le nom de l'exécution (captures_gh.sh retrouve ainsi la sienne)
        type: string
        default: ''
  push:
    branches: ['vague*-t*']

run-name: >-
  ${{ github.event_name == 'push' && format('Captures du panel · {0}', github.ref_name)
  || format('Captures {0} · {1} · {2}', inputs.modes, inputs.parcours || 'tous', inputs.jeton) }}

permissions:
  contents: read

concurrency:
  # Envoi sur une branche de tour : le nouveau annule l'ancien. Lancement à la main : jamais annulé
  # (plusieurs chantiers peuvent capturer la même branche en même temps)
  group: captures-panel-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrice: ${{ steps.m.outputs.matrice }}
      attendus: ${{ steps.m.outputs.attendus }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: m
        env:
          PARCOURS: ${{ inputs.parcours }}
          MODES: ${{ github.event_name == 'push' && 'complet,recents,grand-texte' || inputs.modes }}
        run: |
          [[ "$PARCOURS" =~ ^[a-z0-9,-]*$ && "$MODES" =~ ^[a-z,-]+$ ]] || { echo "entrées invalides"; exit 1; }
          m=$(python3 tests/panel/gh.py plan --modes "$MODES" --parcours "$PARCOURS" | tail -1)
          echo "matrice=$m" >> "$GITHUB_OUTPUT"
          echo "attendus=$(echo "$m" | python3 -c 'import json,sys; print(",".join(j["nom"] for j in json.load(sys.stdin)))')" >> "$GITHUB_OUTPUT"
          echo "$m" | python3 -c 'import json,sys; [print(j["nom"], ":", j["titre"], ":", j["parcours"]) for j in json.load(sys.stdin)]'

  capture:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --ipc=host   # mémoire partagée de l'hôte : /dev/shm de Docker (64 Mo) fait planter Chromium
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrice) }}
    name: ${{ matrix.titre }}
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_VERSION: 1.62.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Playwright et polices
        run: bash tests/ci_conteneur.sh
      - name: Serveur local de l'app
        run: |
          python -m http.server 8731 > /tmp/serveur.log 2>&1 &
          for i in $(seq 1 20); do python -c "import urllib.request as u; u.urlopen('http://localhost:8731/')" 2>/dev/null && break; sleep 0.5; done
      - name: Captures
        env:
          PPL_URL: http://localhost:8731/
          NOM: ${{ matrix.nom }}
          OPT: ${{ matrix.opt }}
          APPAREILS: ${{ matrix.appareils }}
          PARCOURS: ${{ matrix.parcours }}
        run: |
          # shellcheck disable=SC2086
          python -u tests/panel/capture_parcours.py "$RUNNER_TEMP/out/$NOM" $OPT --appareils "$APPAREILS" --parcours "$PARCOURS"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: part-${{ matrix.nom }}
          path: ${{ runner.temp }}/out
          retention-days: 1

  rassembler:
    needs: [plan, capture]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Un dossier par mode, numéros et noms du PC
        env:
          ATTENDUS: ${{ needs.plan.outputs.attendus }}
        run: python3 tests/panel/gh.py fusionner parts captures --attendus "$ATTENDUS"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: captures-panel
          path: captures
          retention-days: 7
