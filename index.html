<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PPL">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>PPL Training</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // En thème clair, la barre d'état iOS doit avoir un texte sombre (lu au lancement)
    try {
      var t = localStorage.getItem('ppl_theme') || 'auto';
      var light = t === 'light' || (t === 'auto' && !matchMedia('(prefers-color-scheme: dark)').matches);
      if (light) document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = 'default';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
