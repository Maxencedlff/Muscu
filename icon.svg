<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect width="192" height="96" rx="42" fill="url(#shine)"/>

  <!-- Barbell -->
  <!-- Left weight -->
  <rect x="14" y="54" width="16" height="38" rx="5" fill="white" opacity="0.9"/>
  <!-- Left collar -->
  <rect x="30" y="61" width="8" height="24" rx="3" fill="white" opacity="0.6"/>
  <!-- Bar -->
  <rect x="38" y="67" width="116" height="12" rx="6" fill="white" opacity="0.85"/>
  <!-- Right collar -->
  <rect x="154" y="61" width="8" height="24" rx="3" fill="white" opacity="0.6"/>
  <!-- Right weight -->
  <rect x="162" y="54" width="16" height="38" rx="5" fill="white" opacity="0.9"/>

  <!-- Left arm -->
  <line x1="58" y1="73" x2="72" y2="100" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="134" y1="73" x2="120" y2="100" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Body -->
  <line x1="96" y1="102" x2="96" y2="140" stroke="white" stroke-width="10" stroke-linecap="round"/>

  <!-- Left leg -->
  <line x1="96" y1="140" x2="76" y2="168" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="96" y1="140" x2="116" y2="168" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="96" cy="90" r="16" fill="white"/>

  <!-- Eyes -->
  <circle cx="90" cy="87" r="2.5" fill="#3b82f6"/>
  <circle cx="102" cy="87" r="2.5" fill="#3b82f6"/>

  <!-- Smile -->
  <path d="M89 94 Q96 100 103 94" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
</svg>
