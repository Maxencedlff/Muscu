<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <!-- Top shine -->
  <rect width="192" height="96" rx="42" fill="url(#shine)"/>

  <!-- Left weight -->
  <rect x="18" y="66" width="26" height="60" rx="7" fill="white" opacity="0.95"/>
  <!-- Left collar -->
  <rect x="44" y="79" width="12" height="34" rx="4" fill="white" opacity="0.6"/>
  <!-- Bar -->
  <rect x="56" y="87" width="80" height="18" rx="9" fill="white"/>
  <!-- Right collar -->
  <rect x="136" y="79" width="12" height="34" rx="4" fill="white" opacity="0.6"/>
  <!-- Right weight -->
  <rect x="148" y="66" width="26" height="60" rx="7" fill="white" opacity="0.95"/>
</svg>
